---
analysis:
  hpoIds: [ ]   # enter HPO IDs here, e.g. [ 'HP:0000001', 'HP:0000002' ]
  
  inheritanceModes: {
    AUTOSOMAL_DOMINANT: 0.1,
    AUTOSOMAL_RECESSIVE_HOM_ALT: 0.1,
    AUTOSOMAL_RECESSIVE_COMP_HET: 2.0,
    X_DOMINANT: 0.1,
    X_RECESSIVE_HOM_ALT: 0.1,
    X_RECESSIVE_COMP_HET: 2.0,
    MITOCHONDRIAL: 0.2
  }

  analysisMode: PASS_ONLY

  frequencySources: [
    UK10K,

    GNOMAD_E_AFR,
    GNOMAD_E_AMR,
    GNOMAD_E_EAS,
    GNOMAD_E_NFE,
    GNOMAD_E_SAS,

    GNOMAD_G_AFR,
    GNOMAD_G_AMR,
    GNOMAD_G_EAS,
    GNOMAD_G_NFE,
    GNOMAD_G_SAS
  ]
  
  pathogenicitySources: [ REVEL, MVP, ALPHA_MISSENSE, REMM, SPLICE_AI, CADD ]

  steps: [
    hiPhivePrioritiser: {runParams: 'human'},
    priorityScoreFilter: { priorityType: HIPHIVE_PRIORITY, minPriorityScore: 0.501 },
    geneBlacklistFilter: { },
    failedVariantFilter: { },
    alleleBalanceFilter: { },
    regulatoryFeatureFilter: { },
    frequencyFilter: { maxFrequency: 2.0 },
    pathogenicityFilter: { keepNonPathogenic: false, target: NON_CODING },
    inheritanceFilter: { },
    omimPrioritiser: { }
  ]
outputOptions:
  outputContributingVariantsOnly: false
  numGenes: 0
  outputDirectory: /NAS/aishwaryav/mva_hackathon/exomiser/exomiser-cli-15.1.0/results
  outputFileName: run1_baseline
  outputFormats: [ HTML, JSON, TSV_GENE, TSV_VARIANT, VCF, PARQUET ]